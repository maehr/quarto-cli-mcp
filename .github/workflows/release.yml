name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default. Each job below asks for what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Integration tests call the real Quarto CLI. They skip when it is absent.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm run build

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Check the tag against package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The tag '$TAG' does not match package.json '$VERSION'."
            exit 1
          fi
          echo "The tag matches package.json."

  publish:
    name: publish to npm
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing reads this token. No long-lived credential is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm needs an existing package before it accepts a trusted publisher, so the first
      # publish of a new name happens by hand. This step keeps that tag, and any re-run of a
      # release, from failing on a version that the registry already holds.
      - name: Look for the version on the registry
        id: registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "The registry already holds $NAME@$VERSION. The publish step is skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "The registry does not hold $NAME@$VERSION yet."
          fi

      - name: Publish
        if: steps.registry.outputs.exists == 'false'
        run: pnpm publish --no-git-checks

  github-release:
    name: github release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # git-cliff wrote one section per version. Take the section of this tag.
      - name: Take the changelog section of this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md holds no section for '$VERSION'."
            exit 1
          fi
          cat release-notes.md

      # Zenodo watches the published release and archives it under a DOI.
      - name: Create the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
