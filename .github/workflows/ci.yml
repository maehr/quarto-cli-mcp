name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Integration tests call the real Quarto CLI. They skip when it is absent.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm run build

  # A matrix job reports one check per combination, so its name is never stable.
  # Branch protection requires this single job instead.
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check the matrix result
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "The test matrix reported '$RESULT'."
            exit 1
          fi
          echo "The test matrix passed."
