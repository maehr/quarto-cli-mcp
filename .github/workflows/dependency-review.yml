name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # This action needs the dependency graph. A private repository needs GitHub Advanced
    # Security for that. Run it only when the repository is public.
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # This project is AGPL-3.0-only. These licences are incompatible with it.
          deny-licenses: LGPL-2.0, BSD-2-Clause-Patent
